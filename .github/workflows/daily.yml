name: Daily News Update

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00)
    # GitHub Actions cron 有延迟，提前到 UTC 23:00(北京时间07:00)以补偿延迟
    - cron: '0 23 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许写入仓库内容

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Run news update
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
      run: |
        cd scripts
        python3 main.py
        
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --staged --quiet || (git commit -m "Auto update: $(date +'%Y-%m-%d %H:%M')" && git push)
